name: Validate relay outage backoff
on:
  push:
    branches: [codex/relay-retry-backoff, codex/reconnect-two-hour-limit, codex/ssh-reconnect-session-isolation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce fixed one-second retry on original source
        if: github.ref == 'refs/heads/codex/relay-retry-backoff'
        shell: pwsh
        run: |
          $baseline = "$env:RUNNER_TEMP/retry-baseline"
          git worktree add --detach $baseline 4b78adb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Get-Content reconnect_test.go -Raw
          $body = [regex]::Match($test, '(?s)func TestHTTPPublication503DoesNotPollEverySecond.*?(?=func TestReconnectSchedule)').Value
          if (!$body) { throw 'Baseline regression case missing' }
          $imports = 'package main' + "`n" + 'import ("context"; "net/http"; "net/http/httptest"; "path/filepath"; "sync/atomic"; "testing"; "time")' + "`n"
          [IO.File]::WriteAllText("$baseline/retry_regression_test.go", $imports + $body)
          Push-Location $baseline
          $result = go test . -run '^TestHTTPPublication503DoesNotPollEverySecond$' -count=1 -v 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $result | Tee-Object -FilePath "$env:RUNNER_TEMP/baseline.txt"
          if ($code -eq 0 -or "$result" -notmatch 'requests in 3.2s, want one initial attempt') { throw 'Original failure was not reproduced' }
          exit 0
      - name: Test outage, concurrency, recovery and existing transport on Windows
        shell: pwsh
        run: |
          go test . -run 'Test(HTTPPublication|Reconnect|RelayOutage|RelayCooldown|ProviderShortSSH|ProviderStartup|ProviderRegistration|RecoveryLock|DialPairing|RelayEndpoints|RelayRejects|PairingStatus|OpenRelayReports|ProviderDrain|ForwardWaits|ReusableFraming|SessionClose)' -count=1 -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/acceptance.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce short-session failures on the deployed source
        shell: pwsh
        run: |
          $baseline = "$env:RUNNER_TEMP/short-session-baseline"
          git worktree add --detach $baseline a3da076138c438cb3fe8381300158f3617ce9242
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item reconnect_limit_test.go,transport_test.go $baseline
          Push-Location $baseline
          $result = go test . -run '^Test(ReconnectLimitShortSessionHandoffsClearOutage|ReconnectLimitHealthyChannelRecoversAfterConcurrentFailure|ProviderShortSSHSessionDoesNotStartOutage)$' -count=1 -v 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $result | Tee-Object -FilePath "$env:RUNNER_TEMP/baseline.txt"
          if ($code -eq 0 -or "$result" -notmatch 'successful short SSH command started provider outage clock' -or "$result" -notmatch 'healthy short sessions stopped at handoff' -or "$result" -notmatch 'never recovered after a concurrent failure') { throw 'Original failures were not reproduced' }
          exit 0
      - name: Build and exercise committed Windows executable
        shell: pwsh
        run: |
          python build-windows-binaries.py "$env:RUNNER_TEMP/output/HITL-Connect-Windows" 2026.10.30-agent.1 --installer-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/output/HITL-Connect-Windows/hitl-connect-cli.exe" agent help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'UNSIGNED VALIDATION BUILD. No signed release or HANG installation is claimed.' | Set-Content "$env:RUNNER_TEMP/output/UNSIGNED.txt"
          Copy-Item LICENSE,NOTICE,THIRD-PARTY-LICENSES.txt,PRIVACY.md,CODE-SIGNING.md "$env:RUNNER_TEMP/output/"
          Get-ChildItem "$env:RUNNER_TEMP/output" -Recurse -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, ([IO.Path]::GetRelativePath("$env:RUNNER_TEMP/output", $_.FullName))
          } | Set-Content "$env:RUNNER_TEMP/SHA256SUMS.txt"
          Move-Item "$env:RUNNER_TEMP/SHA256SUMS.txt" "$env:RUNNER_TEMP/output/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relay-backoff-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/baseline.txt
            ${{ runner.temp }}/acceptance.txt
            ${{ runner.temp }}/output/
          retention-days: 14
