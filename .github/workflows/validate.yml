name: Validate standalone client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test standalone module
        run: go test ./...
      - name: Build Windows binaries from committed source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build-windows-binaries.py "$env:RUNNER_TEMP/output/HITL-Connect-Windows" 2026.10.15-agent.2 --installer-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/output/HITL-Connect-Windows/hitl-connect-cli.exe" agent help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/output/HITL-Connect-Windows/hitl-connect-cli.exe" share --dir "$env:RUNNER_TEMP/unconfigured-provider"
          if ($LASTEXITCODE -eq 0) { throw 'Provider accepted a missing relay' }
          if (Test-Path "$env:RUNNER_TEMP/unconfigured-provider") { throw 'Missing relay created a profile' }
          exit 0
      - name: Copy notices into validation artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE,NOTICE,THIRD-PARTY-LICENSES.txt,PRIVACY.md,CODE-SIGNING.md "$env:RUNNER_TEMP/output/"
          'UNSIGNED VALIDATION BUILD. No certificate or installation acceptance is claimed.' | Set-Content "$env:RUNNER_TEMP/output/UNSIGNED.txt"
          Get-ChildItem "$env:RUNNER_TEMP/output" -Recurse -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, ([IO.Path]::GetRelativePath("$env:RUNNER_TEMP/output", $_.FullName))
          } | Set-Content "$env:RUNNER_TEMP/SHA256SUMS.txt"
          Move-Item "$env:RUNNER_TEMP/SHA256SUMS.txt" "$env:RUNNER_TEMP/output/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: unsigned-windows-validation-${{ github.sha }}
          path: ${{ runner.temp }}/output/
          if-no-files-found: error
          retention-days: 14
